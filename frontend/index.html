<!doctype html>
<html lang="vi" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#FAF7F2" />
    <title>VQT Japanese Food — Ẩm thực Nhật Bản tinh tuyển</title>
    <meta name="description" content="Sushi, sashimi cao cấp, món nướng, ramen, tráng miệng và sake Nhật Bản. Đặt món trực tuyến, giao nhanh tận nơi." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VQT Japanese Food" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+JP:wght@500;700&display=swap"
    />
    <script>
      // Apply the saved theme/language before first paint so there is no flash of the wrong colours
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('jf-ui') || '{}').state || {};
          var theme = saved.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          if (saved.language) document.documentElement.lang = saved.language;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
